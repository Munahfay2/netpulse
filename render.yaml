# Render.com "Blueprint" — https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend as a web service and the React frontend as a
# static site from the same repo. After the first deploy, set
# AFRICASTALKING_USERNAME / AFRICASTALKING_API_KEY in the netpulse-backend
# service's Environment tab (left blank here on purpose — the app runs in
# Demo SMS Mode without them) and add JWT_SECRET as a real secret.
services:
  - type: web
    name: netpulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/netpulse.db
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TELEMETRY_INTERVAL_SECONDS
        value: "5"
      - key: AFRICASTALKING_SENDER_ID
        value: NetPulse
      - key: CORS_ORIGINS
        value: https://netpulse-frontend.onrender.com
      # Set these in the Render dashboard once you have sandbox credentials —
      # left unset here so the service deploys successfully without them.
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
    disk:
      name: netpulse-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: netpulse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://netpulse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
